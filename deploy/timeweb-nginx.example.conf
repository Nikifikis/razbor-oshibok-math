# Separate virtual host; do not replace the TutorPro virtual host.
# Replace the example hostname and enable HTTPS before issuing student codes.
server {
    listen 80;
    server_name razbor.example.com;
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
